name: Build executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: watermark-pdf-linux
          - os: windows-latest
            asset_name: watermark-pdf-windows.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --name watermark-pdf --windowed --onefile \
            --add-data "watermark_pdf/resources:watermark_pdf/resources" \
            --icon watermark_pdf/resources/app.png \
            watermark_pdf/__main__.py

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --name watermark-pdf --windowed --onefile `
            --add-data "watermark_pdf/resources;watermark_pdf/resources" `
            --icon watermark_pdf/resources/app.png `
            watermark_pdf/__main__.py

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        run: mv dist/watermark-pdf "dist/${{ matrix.asset_name }}"

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        run: Move-Item dist/watermark-pdf.exe "dist/${{ matrix.asset_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

      - name: Build .deb package (Linux)
        if: runner.os == 'Linux'
        run: |
          # "v1.0.0" -> "1.0.0"; "0.0.0" for a manual run (dpkg needs a version).
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ github.ref_type }}" != "tag" ]; then
            VERSION="0.0.0"
          fi

          PKGROOT="pkgroot"
          mkdir -p "$PKGROOT/DEBIAN" \
                   "$PKGROOT/usr/bin" \
                   "$PKGROOT/usr/share/applications" \
                   "$PKGROOT/usr/share/pixmaps"

          cp "dist/${{ matrix.asset_name }}" "$PKGROOT/usr/bin/watermark-pdf"
          chmod 755 "$PKGROOT/usr/bin/watermark-pdf"

          # Launcher icon (optional: skipped if the file does not exist).
          ICON_LINE=""
          if [ -f watermark_pdf/resources/app.png ]; then
            cp watermark_pdf/resources/app.png "$PKGROOT/usr/share/pixmaps/watermark-pdf.png"
            ICON_LINE="Icon=watermark-pdf"
          fi

          cat > "$PKGROOT/DEBIAN/control" <<EOF
          Package: watermark-pdf
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgl1, libxkbcommon-x11-0, libxcb-icccm4, libxcb-image0, libxcb-keysyms1, libxcb-randr0, libxcb-render-util0, libxcb-shape0, libxcb-xinerama0, libxcb-xkb1
          Maintainer: Artezaru <artezaru.github@proton.me>
          Description: Add a repeated text watermark to PDF files.
           Desktop application (PyQt5) to watermark a single PDF or a whole
           folder, with a live preview.
          EOF

          cat > "$PKGROOT/usr/share/applications/watermark-pdf.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=PDF Watermark
          Comment=Add a text watermark to PDF files
          Exec=/usr/bin/watermark-pdf %F
          $ICON_LINE
          Terminal=false
          MimeType=application/pdf;
          Categories=Office;Utility;
          EOF

          dpkg-deb --build --root-owner-group "$PKGROOT" "dist/watermark-pdf_${VERSION}_amd64.deb"

      - name: Upload .deb artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: watermark-pdf-deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*